services:
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: pedidos360-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  orders-service:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports: ["8081:8081"]
    depends_on:
      rabbitmq:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    ports: ["8082:8082"]
  bff-service:
    build:
      context: .
      dockerfile: bff-service/Dockerfile
    environment:
      AZURE_ISSUER_URI: ${AZURE_ISSUER_URI}
      AZURE_API_AUDIENCE: ${AZURE_API_AUDIENCE}
      AZURE_JWK_SET_URI: ${AZURE_JWK_SET_URI:-https://login.microsoftonline.com/common/discovery/v2.0/keys}
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2: TRACE
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      ORDERS_SERVICE_URL: http://orders-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
    ports: ["8080:8080"]
    depends_on: [orders-service, catalog-service]

  rabbit-admin-service:
    build:
      context: .
      dockerfile: rabbit-admin-service/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports: ["8083:8083"]
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq_data:
